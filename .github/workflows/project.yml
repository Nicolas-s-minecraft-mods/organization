name: Project

# Synchronizes the open issues of all the repositories of the organization with the project "Mods project" (see
# scripts/project_sync.py): it adds the issues to the project, sets the field "Estimate" from the line "Estimate:" of
# each issue, sets the fields "Start date" and "Target date" from the lines "Start:" and "Target:", and adds the
# dependencies of the lines "Blocked by:" and "Blocks:".
# The workflow runs each hour, after a change of the script on main, and with "Run workflow". A fork skips the job.
# The secret PROJECT_TOKEN (secret of the organization) is a token with the permissions of scripts/project_sync.py.

on:
  schedule:
    - cron: '23 * * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/project_sync.py'
      - '.github/workflows/project.yml'
  workflow_dispatch:
    inputs:
      dry-run:
        description: Show the changes, and change nothing
        type: boolean
        default: false

permissions:
  contents: read

# One synchronization at a time. A new run waits for the run before it.
concurrency:
  group: project-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Synchronize the project
    if: github.repository_owner == 'Nicolas-s-minecraft-mods'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Synchronize the project
        env:
          PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          DRY_RUN: ${{ inputs.dry-run && '--dry-run' || '' }}
        run: python3 scripts/project_sync.py --org "$GITHUB_REPOSITORY_OWNER" --project 2 $DRY_RUN
